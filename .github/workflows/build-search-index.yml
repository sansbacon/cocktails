name: Build Search Index

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Update index.html cocktail list
        run: node ./scripts/update-index.js

      - name: Build search index
        run: node ./scripts/build-search-index.js

      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html search-index.json
          git diff --cached --quiet || git commit -m 'chore: regenerate index.html and search-index.json'
      - name: Push changes
        if: github.event_name == 'push'
        run: |
          git push origin HEAD:${{ github.ref_name }}
